<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {{ content }}
  <script id="cities-data" type="application/json">{{ site.data.cities | jsonify }}</script>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
{% include site-footer.html %}
</html>
