title: Event Index
description: Game development event index
baseurl: "/gamedev-index"
url: ""

# Build settings
markdown: kramdown
permalink: pretty

# Collections
collections:
  listings:
    output: true
    permalink: /event/:name/

# Default layout for listings
defaults:
  - scope:
      path: ""
      type: "listings"
    values:
      layout: "event"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - tsconfig.json
  - src
  - dist
  - "*.ts"
  - README.md
  - CLAUDE.md
