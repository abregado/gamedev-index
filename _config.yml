title: GameDevTreffs
description: A list of local game development communities and events, which you can sort by distance. Mainly meetups, but also game jams, workshops, exhibitions and more.
baseurl: ""
url: "https://gamedevtreffs.de"

# Build settings
markdown: kramdown
permalink: pretty

# Collections
collections:
  listings:
    output: true
    permalink: /event/:name/

# Default layout for listings
defaults:
  - scope:
      path: ""
      type: "listings"
    values:
      layout: "event"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - tsconfig.json
  - src
  - dist
  - "*.ts"
  - README.md
  - CLAUDE.md
