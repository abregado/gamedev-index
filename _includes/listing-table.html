<table class="listings-table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Location</th>
      <th>Distance</th>
      <th>Description</th>
      <th>Tags</th>
    </tr>
  </thead>
  <tbody>
    {% for listing in site.listings %}
    <tr class="listing-row"
        data-cities="{{ listing.cities | jsonify }}"
        data-tags="{{ listing.tags | jsonify }}"
        data-content="{{ listing.content | strip_html | escape }}">
      <td>
        {% if listing.url %}
          <a href="{{ listing.url }}" target="_blank" rel="noopener">{{ listing.title }}</a>
        {% else %}
          {{ listing.title }}
        {% endif %}
      </td>
      <td class="location-cell">{{ listing.cities | first }}</td>
      <td><span class="distance no-city">-</span></td>
      <td class="description-cell"></td>
      <td>
        <div class="listing-tags">
          {% for tag in listing.tags %}
            <span class="listing-tag">{{ tag }}</span>
          {% endfor %}
        </div>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
