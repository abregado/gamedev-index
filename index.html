---
layout: default
title: Event Index
---

<!-- Hero Header: always visible, scrolls normally -->
<header class="header-hero" id="header-hero">
  <a href="{{ '/event-hinzufuegen/' | relative_url }}" class="header-add-button" title="Add your event">+</a>
  <h1 class="header-hero-title">Event Index</h1>
  <p class="header-hero-subtitle">Find gamedev events near you</p>
  <div class="city-selector">
    <input type="text" class="city-input" placeholder="Enter your city..." autocomplete="off">
    <div class="city-suggestions"></div>
  </div>
</header>

<!-- Compact Header: fixed, fades in when hero scrolls out of view -->
<header class="header-compact" id="header-compact">
  <div class="header-compact-inner">
    <div class="header-compact-content">
      <div class="city-selector">
        <input type="text" class="city-input" placeholder="Enter your city..." autocomplete="off">
        <div class="city-suggestions"></div>
      </div>
      <h1 class="header-compact-title">Event Index</h1>
      <a href="{{ '/event-hinzufuegen/' | relative_url }}" class="header-add-button" title="Add your event">+</a>
    </div>
  </div>
</header>

<div class="tag-filters">
  <div class="tag-filters-content">
    <div class="tag-filters-main" id="tag-filters-main"></div>
    <div class="tag-filters-expanded" id="tag-filters-expanded"></div>
  </div>
  <button class="tag-filters-toggle" id="tag-filters-toggle" style="display: none;">
    <span class="toggle-icon">&#9662;</span>
  </button>
</div>

<div class="empty-message" id="empty-message" style="display: none;">
  <p>No events match your current filters.</p>
  <p class="empty-hint">Try setting some tags to "Allowed" or removing "Disallowed" tags.</p>
</div>
