<h1>Event Index</h1>

<div class="controls">
  <div class="city-selector">
    <input type="text" id="city-input" placeholder="Search for your city..." autocomplete="off">
    <div id="city-suggestions" class="city-suggestions"></div>
  </div>
</div>

<div class="tag-filters">
  <div class="tag-filters-content">
    <div class="tag-filters-main" id="tag-filters-main"></div>
    <div class="tag-filters-expanded" id="tag-filters-expanded"></div>
  </div>
  <button class="tag-filters-toggle" id="tag-filters-toggle" style="display: none;">
    <span class="toggle-icon">&#9662;</span>
  </button>
</div>

<div class="empty-message" id="empty-message" style="display: none;">
  <p>No events match your current filters.</p>
  <p class="empty-hint">Try setting some tags to "Allowed" or removing "Disallowed" tags.</p>
</div>
